<!DOCTYPE html>
<html>
<head>
    <title>Gang Empire</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; }
        #grid { display: grid; grid-template-columns: repeat(4, 50px); gap: 5px; justify-content: center; }
        .tile { width: 50px; height: 50px; background: #444; border: 1px solid #666; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Gang Empire</h1>
    <p>Penge: <span id="money">100</span> | Territorier: <span id="territories">0</span></p>
    <div id="grid"></div>

    <script>
        async function updateUI() {
            const res = await fetch('/api/state');
            const data = await res.json();
            document.getElementById('money').innerText = data.money;
            document.getElementById('territories').innerText = data.territories;
        }

        async function attack() {
            const res = await fetch('/api/attack', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                updateUI();
            } else {
                alert(data.message);
            }
        }

        // Lav gitteret
        const grid = document.getElementById('grid');
        for(let i=0; i<16; i++) {
            let tile = document.createElement('div');
            tile.className = 'tile';
            tile.onclick = attack;
            grid.appendChild(tile);
        }

        updateUI();
    </script>
</body>
</html>
